<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Link Mail 설정</title>
  <style>
    body{background:#f3f6fb;color:#172032;font:15px/1.6 system-ui,-apple-system,"Malgun Gothic",sans-serif;margin:0;padding:38px 18px}
    main{max-width:600px;margin:auto;background:#fff;padding:30px;border-radius:18px;box-shadow:0 10px 36px #163b6812}
    h1{margin:0 0 6px;font-size:25px}p{color:#536173}label{display:block;font-weight:650;margin:24px 0 7px}
    input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ccd4e0;border-radius:9px;font-size:15px}
    button{border:0;border-radius:9px;padding:11px 18px;font-size:14px;cursor:pointer;font-weight:650}
    .primary{background:#1d4ed8;color:#fff}.secondary{background:#e9eff8;color:#18304b}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}
    #status{min-height:24px;color:#175a33;white-space:pre-wrap}#status.error{color:#b91c1c}
    .note{font-size:13px;color:#58667b;background:#f3f6fb;padding:14px;border-radius:9px}
    .history{border-top:1px solid #e6eaf0;padding-top:14px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
  </style>
</head>
<body><main>
  <h1>✉ Quick Link Mail</h1>
  <p>현재 탭 링크를 고정된 Gmail 주소로 전송합니다.</p>
  <label for="recipient">고정 수신 Gmail 주소</label>
  <input type="email" id="recipient" placeholder="recipient@gmail.com" autocomplete="email" required>
  <div class="actions"><button class="primary" id="save">수신자 저장</button></div>
  <label>Google 발신 계정</label>
  <div class="actions">
    <button class="secondary" id="auth">Google 계정 인증</button>
    <button class="secondary" id="reset">계정 연결 초기화</button>
  </div>
  <p class="note">인증 시 선택한 Google 계정이 발신자입니다. Chrome에서 로그인한 기본 계정과 같을 필요는 없습니다. 다른 계정 선택이 보이지 않으면 해당 Google 계정을 Chrome 프로필에 추가해야 할 수 있습니다. 메일 발송(gmail.send) 권한만 요청합니다.</p>
  <div id="status" role="status" aria-live="polite"></div>
  <div class="history" id="history">최근 발송 내역 없음</div>
</main><script type="module" src="options.js"></script></body></html>
